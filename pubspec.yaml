name: pqdga
description: A defensive research framework for studying deterministic namespace/rendezvous constructions under different cryptographic binding models, including ML-KEM, ML-DSA, SLH-DSA, KMAC, hybrid key material, ratcheting, hierarchical derivation, multi-party and threshold models.
version: 0.1.0
repository: https://github.com/turkananation/pqdga
homepage: https://turkananation.github.io/pqdga/

environment:
  sdk: ^3.12.0

# Add regular dependencies here.
dependencies:
  pointycastle: ^4.0.0
  pqforge: ^0.3.0
  # Direct for SHAKE XOF + FIPS 205 SLH-DSA (pqforge 0.3.x does not re-export SLH-DSA).
  # Override below lifts past pqforge's ^0.3.1 constraint while ML-KEM/ML-DSA APIs stay compatible.
  pqcrypto: ^0.4.0
  # Research plumbing: epoch buckets, Result/validators, codecs — not crypto.
  swissarmyknife: ^0.1.0

dependency_overrides:
  # pqforge 0.3.0 pins pqcrypto ^0.3.1; 0.4.0 adds SLH-DSA without breaking KEM/DSA call sites used here.
  pqcrypto: ^0.4.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
