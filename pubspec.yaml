name: pqdga
description: >-
  Defensive-research framework for deterministic domain-generation algorithms,
  studying how post-quantum primitives change their predictability properties.
  Lab kit for SOC and IR.
version: 0.2.0
repository: https://github.com/turkananation/pqdga
homepage: https://turkananation.github.io/pqdga/

environment:
  sdk: ^3.12.0

# Add regular dependencies here.
dependencies:
  pointycastle: ^4.0.0
  # Direct dependency: pqdga calls the ML-KEM / ML-DSA / SLH-DSA primitives
  # directly, and pqforge does not re-export them.
  pqcrypto: ^0.4.2
  pqforge: ^0.4.3
  swissarmyknife: ^0.1.0
  # Secret-buffer zeroing for lab sessions that hold private key material.
  # Pure Dart, single transitive dependency (package:meta).
  zeroize: ^0.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
