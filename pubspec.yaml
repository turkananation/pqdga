name: pqdga
description: A defensive research framework for studying deterministic namespace/rendezvous constructions under different cryptographic binding models, including ML-KEM, ML-DSA, SLH-DSA, KMAC, hybrid key material, ratcheting, hierarchical derivation, multi-party and threshold models.
version: 0.1.0
repository: https://github.com/turkananation/pqdga
homepage: https://turkananation.github.io/pqdga/

environment:
  sdk: ^3.12.0

# Add regular dependencies here.
dependencies:
  pointycastle: ^4.0.0
  pqforge: ^0.4.3
  swissarmyknife: ^0.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
